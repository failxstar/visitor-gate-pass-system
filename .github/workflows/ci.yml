name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: visitor_gatepass_test
          POSTGRES_USER: visitor_app
          POSTGRES_PASSWORD: siva
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visitor_app -d visitor_gatepass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test backend
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/visitor_gatepass_test
          TEST_DB_USERNAME: visitor_app
          TEST_DB_PASSWORD: siva
        run: mvn clean verify

  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~/visitor-gate-pass-system

            echo "Updating source code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Building backend..."
            cd backend
            mvn clean package -DskipTests

            echo "Restarting Spring Boot..."
            sudo systemctl restart visitor-gate-pass

            echo "Building frontend..."
            cd ../frontend
            npm ci
            npm run build

            echo "Updating frontend files..."
            sudo rm -rf /var/www/visitor-gate-pass/*
            sudo cp -r dist/* /var/www/visitor-gate-pass/
            sudo chown -R www-data:www-data /var/www/visitor-gate-pass

            echo "Checking Nginx configuration..."
            sudo nginx -t
            sudo systemctl reload nginx

            echo "Checking application health..."
            curl -fsS http://localhost/api/health

            echo "Deployment successful!"
