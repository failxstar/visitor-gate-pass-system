name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ============================================================
  # BACKEND BUILD AND TEST
  # ============================================================

  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_DB: visitor_gatepass_test
          POSTGRES_USER: visitor_app
          POSTGRES_PASSWORD: siva

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U visitor_app -d visitor_gatepass_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test backend
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/visitor_gatepass_test
          TEST_DB_USERNAME: visitor_app
          TEST_DB_PASSWORD: siva
        run: mvn clean verify


  # ============================================================
  # FRONTEND LINT AND BUILD
  # ============================================================

  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  # ============================================================
  # DEPLOY TO AWS EC2
  # ============================================================

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:

      # --------------------------------------------------------
      # Configure AWS credentials
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1


      # --------------------------------------------------------
      # Verify AWS account
      # --------------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # --------------------------------------------------------
      # Deploy through AWS Systems Manager
      # --------------------------------------------------------

      - name: Deploy through AWS Systems Manager
        shell: bash
        run: |

          set -e

          cat > /tmp/ssm-commands.sh <<'EOF'

          #!/bin/bash

          set -e


          echo "========================================"
          echo "Starting deployment..."
          echo "========================================"


          # ======================================================
          # UPDATE SOURCE CODE
          # ======================================================

          echo "Updating source code..."

          cd /home/ubuntu/visitor-gate-pass-system

          sudo -H -u ubuntu git fetch origin main

          sudo -H -u ubuntu git reset --hard origin/main

          echo "Source code updated."


          # ======================================================
          # BUILD BACKEND
          # ======================================================

          echo "========================================"
          echo "Building backend..."
          echo "========================================"

          cd /home/ubuntu/visitor-gate-pass-system/backend

          sudo -H -u ubuntu mvn clean package -DskipTests

          echo "Backend build completed."


          # ======================================================
          # RESTART SPRING BOOT
          # ======================================================

          echo "========================================"
          echo "Restarting Spring Boot..."
          echo "========================================"

          systemctl restart visitor-gate-pass

          echo "Spring Boot restart command sent."


          # ======================================================
          # WAIT FOR SPRING BOOT
          # ======================================================

          echo "========================================"
          echo "Waiting for Spring Boot to start..."
          echo "========================================"

          for i in {1..30}; do

            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then

              echo "Spring Boot is healthy."

              break

            fi


            if [ "$i" -eq 30 ]; then

              echo "Spring Boot did not become healthy within 60 seconds."

              echo "========================================"
              echo "Spring Boot service status"
              echo "========================================"

              systemctl status visitor-gate-pass --no-pager -l

              echo "========================================"
              echo "Recent Spring Boot logs"
              echo "========================================"

              journalctl -u visitor-gate-pass -n 100 --no-pager

              exit 1

            fi


            echo "Waiting for Spring Boot... ($i/30)"

            sleep 2

          done


          echo "Spring Boot restarted and is healthy."


          # ======================================================
          # BUILD FRONTEND
          # ======================================================

          echo "========================================"
          echo "Building frontend..."
          echo "========================================"

          cd /home/ubuntu/visitor-gate-pass-system/frontend

          sudo -H -u ubuntu npm ci

          sudo -H -u ubuntu npm run build

          echo "Frontend build completed."


          # ======================================================
          # UPDATE FRONTEND FILES
          # ======================================================

          echo "========================================"
          echo "Updating frontend files..."
          echo "========================================"

          rm -rf /var/www/visitor-gate-pass/*

          cp -r dist/* /var/www/visitor-gate-pass/

          chown -R www-data:www-data /var/www/visitor-gate-pass

          echo "Frontend files updated."


          # ======================================================
          # CHECK NGINX
          # ======================================================

          echo "========================================"
          echo "Checking Nginx..."
          echo "========================================"

          nginx -t

          systemctl reload nginx

          echo "Nginx reloaded."


          # ======================================================
          # FINAL APPLICATION HEALTH CHECK
          # ======================================================

          echo "========================================"
          echo "Checking application health..."
          echo "========================================"

          curl -fsS http://localhost/api/health

          echo ""


          # ======================================================
          # DEPLOYMENT SUCCESS
          # ======================================================

          echo "========================================"
          echo "DEPLOYMENT SUCCESSFUL!"
          echo "========================================"

          EOF


          # ======================================================
          # CREATE SSM PARAMETERS
          # ======================================================

          python3 - <<'PY'

          import json

          with open("/tmp/ssm-commands.sh", "r") as f:
              script = f.read()

          with open("/tmp/ssm-parameters.json", "w") as f:
              json.dump(
                  {
                      "commands": [script]
                  },
                  f
              )

          PY


          # ======================================================
          # SEND COMMAND TO EC2
          # ======================================================

          echo "Sending deployment command to EC2..."


          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-08dbf81ac3eb3afe3 \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy visitor-gate-pass $GITHUB_SHA" \
            --parameters file:///tmp/ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)


          echo "SSM Command ID: $COMMAND_ID"


          # ======================================================
          # WAIT FOR DEPLOYMENT
          # ======================================================

          echo "Waiting for deployment..."


          for i in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-08dbf81ac3eb3afe3 \
              --query "Status" \
              --output text)


            echo "Deployment status: $STATUS"


            case "$STATUS" in

              Success)

                echo ""
                echo "===== DEPLOYMENT OUTPUT ====="

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-08dbf81ac3eb3afe3 \
                  --query "StandardOutputContent" \
                  --output text

                echo ""

                echo "Deployment completed successfully!"

                exit 0

                ;;


              Failed|Cancelled|TimedOut|Cancelling)

                echo ""
                echo "===== DEPLOYMENT OUTPUT ====="

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-08dbf81ac3eb3afe3 \
                  --query "StandardOutputContent" \
                  --output text


                echo ""
                echo "===== DEPLOYMENT ERROR ====="

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-08dbf81ac3eb3afe3 \
                  --query "StandardErrorContent" \
                  --output text


                exit 1

                ;;

            esac


            sleep 5

          done


          echo "Deployment timed out."

          exit 1
